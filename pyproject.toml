[project]
name = "clinvar-proto-generator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
# Distribution is `xsd-former` on PyPI; it provides the `xsdformer` CLI.
dev = ["xsd-former>=1.3.0"]
# The round-trip test builds the package and imports it, so it needs the
# generated package's runtime deps alongside pytest.
#
# protobuf is coupled to the `grpcio-tools` version pinned in uv.lock: protoc
# bakes its gencode version into the generated `_pb2`, and the runtime refuses to
# load gencode newer than itself — `VersionError` at import, not a silent
# misparse. grpcio-tools arrives transitively via xsd-former, so bumping either
# can strand a consumer; `tests/test_gencode_version.py` asserts the pair still
# works here. The generated wheel declares its own `protobuf>=` floor, emitted by
# the engine as a constant and independent of whichever protoc ran, so that floor
# is only sound while it is >= the baked gencode version.
test = [
  "xsd-former>=1.3.0",
  "pytest",
  "lxml",
  "protobuf>=6.32.1",
  "pydantic>=2",
]

lint = ["ruff", "pre-commit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# The generated tree (generated/) is gitignored and not linted; the only
# first-party Python here is the test suite. Config mirrors the CPG standard
# (litfetch), scoped down to what this repo carries.
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["A", "B", "C", "D", "E", "F", "G", "I", "N", "Q", "S", "W", "ARG", "PL", "RET", "RUF", "SIM", "UP"]
ignore = [
  "COM812",  # conflicts with the formatter
  "D100", "D101", "D102", "D103", "D104",  # don't require docstrings on every symbol
  "Q000", "Q003",  # single-quote formatter handles quote style
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",   # asserts are the pytest idiom
  "S603",   # subprocess calls are intentional here
  "S607",   # invoking the xsdformer CLI by name is intentional
]

[tool.ruff.lint.pydocstyle]
convention = "google"
